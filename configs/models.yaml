# Universal ML interatomic potentials compared in this project.
#
# The models form controlled pairs, each differing mainly in one factor:
#   training data: mace-mp-0 (MPtrj)      vs  mace-omat-0 (OMat24)     MACE family, PBE(+U)
#   functional:    mace-matpes-pbe-0      vs  mace-matpes-r2scan-0     both fine-tuned from
#                  MACE-OMAT-0 on MatPES structures computed with PBE and with r2SCAN
#   architecture:  mace-omat-0            vs  orb-v3-omat              both trained on OMat24
#
# checkpoint: for MACE, the name passed to mace.calculators.mace_mp(model=...), see
# mace/calculators/foundations_models.py (mace-torch 0.3.16); for ORB, the loader
# function in orb_models.forcefield.pretrained (orb-models 0.7.0).
# The order of the entries fixes each model's colour in the figures.

mace-mp-0:
  family: mace
  checkpoint: medium
  label: MACE-MP-0
  training_data: MPtrj (~1.6M structures from Materials Project relaxations)
  functional: PBE/PBE+U
  license: MIT

mace-omat-0:
  family: mace
  checkpoint: medium-omat-0
  label: MACE-OMAT-0
  training_data: OMat24 (~100M non-equilibrium structures)
  functional: PBE/PBE+U
  license: ASL (academic, non-commercial use only)

mace-matpes-pbe-0:
  family: mace
  checkpoint: mace-matpes-pbe-0
  label: MACE-MATPES-PBE-0
  training_data: MACE-OMAT-0 fine-tuned on MatPES-PBE (~430k structures)
  functional: PBE
  license: ASL (academic, non-commercial use only)

mace-matpes-r2scan-0:
  family: mace
  checkpoint: mace-matpes-r2scan-0
  label: MACE-MATPES-r2SCAN-0
  training_data: MACE-OMAT-0 fine-tuned on MatPES-r2SCAN (~390k structures)
  functional: r2SCAN
  license: ASL (academic, non-commercial use only)

orb-v3-omat:
  family: orb
  checkpoint: orb_v3_conservative_inf_omat
  label: ORB-v3-OMAT
  training_data: OMat24; conservative forces, unlimited neighbours within 6 A
  functional: PBE/PBE+U
  license: Apache-2.0

# MACE-MP-0 with Grimme D3(BJ) dispersion, as used by Fromsejer et al. (2025). It tests how much of
# MACE-MP-0's softening comes from its too-large equilibrium volume.
mace-mp-0-d3:
  family: mace
  checkpoint: medium
  label: MACE-MP-0 + D3
  training_data: MPtrj (~1.6M structures from Materials Project relaxations)
  functional: PBE/PBE+U, plus D3(BJ) dispersion
  license: MIT
  dispersion: true
